PACKAGE_NAME="davinci_ascend"
PACKAGE_VERSION="1.0"
CLEAN="make clean"
# Keep DKMS's module manifest aligned with the Makefile's bare-metal default.
BUILD_VASCEND="${BUILD_VASCEND:-n}"
case "${BUILD_VASCEND}" in
    y|n) ;;
    *) echo "BUILD_VASCEND must be y or n" >&2; return 1 ;;
esac

if [ -z "${Driver_Install_Mode}" ]; then
    if [ -f /etc/ascend_install.info ]; then
        Driver_Install_Mode=$(grep Driver_Install_Mode /etc/ascend_install.info | awk -F [=] '{printf $NF}')
    fi
    [ -z "${Driver_Install_Mode}" ] && Driver_Install_Mode="normal"
fi

# By default, DKMS will add KERNELRELEASE to the make command line; however,
# this will cause the kernel module build to infer that it was invoked via
# Kbuild directly instead of DKMS. The dkms(8) manual page recommends quoting
# the 'make' command name to suppress this behavior.
MAKE[0]="'make' all KERNEL_UNAME=${kernelver} DAVINCI_HIAI_DKMS=y TARGET_PRODUCT=mini Driver_Install_Mode=${Driver_Install_Mode} BUILD_VASCEND=${BUILD_VASCEND}"

if [ "${Driver_Install_Mode}" = "vnpu_guest" ]; then
    BUILT_MODULE_NAME[0]="drv_vdevmm"
    BUILT_MODULE_NAME[1]="drv_vdevmng"
    BUILT_MODULE_NAME[2]="drv_vhdc"
    BUILT_MODULE_NAME[3]="drv_vpcie"
    BUILT_MODULE_NAME[4]="drv_vtsdrv"
    BUILT_MODULE_NAME[5]="drv_seclib_host"
    BUILT_MODULE_NAME[6]="drv_davinci_intf_host"
    BUILT_MODULE_NAME[7]="drv_vpc_agent"
    BUILT_MODULE_NAME[8]="ascend_uda"
    BUILT_MODULE_NAME[9]="ascend_soc_resmng"
    BUILT_MODULE_NAME[10]="dbl_runenv_config"
    BUILT_MODULE_NAME[11]="ascend_logdrv"
    BUILT_MODULE_NAME[12]="ascend_kernel_adapt"
    BUILT_MODULE_NAME[13]="ascend_kernel_open_adapt"

    BUILT_MODULE_LOCATION[0]="svmdrv/vmaster"
    BUILT_MODULE_LOCATION[1]="dms"
    BUILT_MODULE_LOCATION[2]="vhdc"
    BUILT_MODULE_LOCATION[3]="vmng_agent"
    BUILT_MODULE_LOCATION[4]="ts_drv_vm"
    BUILT_MODULE_LOCATION[5]="libc_sec"
    BUILT_MODULE_LOCATION[6]="drv_davinci_intf_host"
    BUILT_MODULE_LOCATION[7]="vmng_vpc_drv"
    BUILT_MODULE_LOCATION[8]="dbl/uda"
    BUILT_MODULE_LOCATION[9]="dbl/soc_resmng"
    BUILT_MODULE_LOCATION[10]="dbl/runenv_config"
    BUILT_MODULE_LOCATION[11]="logdrv/host"
    BUILT_MODULE_LOCATION[12]="dbl/kernel_adapt"
    BUILT_MODULE_LOCATION[13]="kernel_adapt"
else
    BUILT_MODULE_NAME[0]="drv_pcie_host"
    BUILT_MODULE_NAME[1]="drv_pcie_hdc_host"
    BUILT_MODULE_NAME[2]="drv_pcie_vnic_host"
    BUILT_MODULE_NAME[3]="drv_devmng_host"
    BUILT_MODULE_NAME[4]="drv_seclib_host"
    BUILT_MODULE_NAME[5]="drv_devdrv_host"
    BUILT_MODULE_NAME[6]="drv_devmm_host"
    BUILT_MODULE_NAME[7]="drv_tsdrv_platform_host"
    BUILT_MODULE_NAME[8]="drv_davinci_intf_host"
    BUILT_MODULE_NAME[9]="ascend_event_sched_host"
    BUILT_MODULE_NAME[10]="ascend_queue"    # host
    BUILT_MODULE_NAME[11]="drv_soft_fault"
    BUILT_MODULE_NAME[12]="drv_virtmng_host"
    BUILT_MODULE_NAME[13]="drv_vascend_stub"
    BUILT_MODULE_NAME[14]="ts_agent"
    BUILT_MODULE_NAME[15]="drv_vascend"
    BUILT_MODULE_NAME[16]="dbl_algorithm"
    BUILT_MODULE_NAME[17]="dbl_dev_identity"
    BUILT_MODULE_NAME[18]="dbl_runenv_config"
    BUILT_MODULE_NAME[19]="drv_dp_proc_mng_host"
    BUILT_MODULE_NAME[20]="drv_vpc_host"
    BUILT_MODULE_NAME[21]="ascend_dms_dtm"
    BUILT_MODULE_NAME[22]="ascend_uda"
    BUILT_MODULE_NAME[23]="ascend_xsmem"    # host
    BUILT_MODULE_NAME[24]="ascend_urd"
    BUILT_MODULE_NAME[25]="ascend_soc_resmng"
    BUILT_MODULE_NAME[26]="ascend_dms_smf"
    BUILT_MODULE_NAME[27]="ascend_logdrv"
    BUILT_MODULE_NAME[28]="ascend_kernel_adapt"
    BUILT_MODULE_NAME[29]="ts_debug"
    BUILT_MODULE_NAME[30]="debug_switch"
    BUILT_MODULE_NAME[31]="ascend_kernel_open_adapt"

    BUILT_MODULE_LOCATION[0]="pcie_host"
    BUILT_MODULE_LOCATION[1]="hdc_host"
    BUILT_MODULE_LOCATION[2]="pcievnic_host"
    BUILT_MODULE_LOCATION[3]="dms"
    BUILT_MODULE_LOCATION[4]="libc_sec"
    BUILT_MODULE_LOCATION[5]="ts_drv_host"
    BUILT_MODULE_LOCATION[6]="svmdrv/pmaster"
    BUILT_MODULE_LOCATION[7]="ts_platform_host"
    BUILT_MODULE_LOCATION[8]="drv_davinci_intf_host"
    BUILT_MODULE_LOCATION[9]="event_sched/host"
    BUILT_MODULE_LOCATION[10]="queue/host"
    BUILT_MODULE_LOCATION[11]="soft_fault"
    BUILT_MODULE_LOCATION[12]="vmng_host"
    BUILT_MODULE_LOCATION[13]="vascend_drv_stub"
    BUILT_MODULE_LOCATION[14]="ts_agent"
    BUILT_MODULE_LOCATION[15]="vascend_drv"
    BUILT_MODULE_LOCATION[16]="dbl/comm_algorithm"
    BUILT_MODULE_LOCATION[17]="dbl/dev_identity"
    BUILT_MODULE_LOCATION[18]="dbl/runenv_config"
    BUILT_MODULE_LOCATION[19]="dp_proc_mng/pmaster"
    BUILT_MODULE_LOCATION[20]="vmng_vpc_drv"
    BUILT_MODULE_LOCATION[21]="dms/dtm"
    BUILT_MODULE_LOCATION[22]="dbl/uda"
    BUILT_MODULE_LOCATION[23]="xsmem/dc/xsmem_host"
    BUILT_MODULE_LOCATION[24]="dbl/dev_urd"
    BUILT_MODULE_LOCATION[25]="dbl/soc_resmng"
    BUILT_MODULE_LOCATION[26]="dms/smf"
    BUILT_MODULE_LOCATION[27]="logdrv/host"
    BUILT_MODULE_LOCATION[28]="dbl/kernel_adapt"
    BUILT_MODULE_LOCATION[29]="debug"
    BUILT_MODULE_LOCATION[30]="debug"
    BUILT_MODULE_LOCATION[31]="kernel_adapt"
fi

DEST_MODULE_LOCATION[0]="/updates"
DEST_MODULE_LOCATION[1]="/updates"
DEST_MODULE_LOCATION[2]="/updates"
DEST_MODULE_LOCATION[3]="/updates"
DEST_MODULE_LOCATION[4]="/updates"
DEST_MODULE_LOCATION[5]="/updates"
DEST_MODULE_LOCATION[6]="/updates"
DEST_MODULE_LOCATION[7]="/updates"
DEST_MODULE_LOCATION[8]="/updates"
DEST_MODULE_LOCATION[9]="/updates"
DEST_MODULE_LOCATION[10]="/updates"
DEST_MODULE_LOCATION[11]="/updates"
DEST_MODULE_LOCATION[12]="/updates"
DEST_MODULE_LOCATION[13]="/updates"
if [ "${Driver_Install_Mode}" != "vnpu_guest" ]; then
    DEST_MODULE_LOCATION[14]="/updates"
    DEST_MODULE_LOCATION[15]="/updates"
    DEST_MODULE_LOCATION[16]="/updates"
    DEST_MODULE_LOCATION[17]="/updates"
    DEST_MODULE_LOCATION[18]="/updates"
    DEST_MODULE_LOCATION[19]="/updates"
    DEST_MODULE_LOCATION[20]="/updates"
    DEST_MODULE_LOCATION[21]="/updates"
    DEST_MODULE_LOCATION[22]="/updates"
    DEST_MODULE_LOCATION[23]="/updates"
    DEST_MODULE_LOCATION[24]="/updates"
    DEST_MODULE_LOCATION[25]="/updates"
    DEST_MODULE_LOCATION[26]="/updates"
    DEST_MODULE_LOCATION[27]="/updates"
    DEST_MODULE_LOCATION[28]="/updates"
    DEST_MODULE_LOCATION[29]="/updates"
    DEST_MODULE_LOCATION[30]="/updates"
    DEST_MODULE_LOCATION[31]="/updates"
fi

if [ "${Driver_Install_Mode}" != "vnpu_guest" ] && [ "${BUILD_VASCEND}" = "n" ]; then
    unset 'BUILT_MODULE_NAME[15]' 'BUILT_MODULE_LOCATION[15]' 'DEST_MODULE_LOCATION[15]'
    BUILT_MODULE_NAME=("${BUILT_MODULE_NAME[@]}")
    BUILT_MODULE_LOCATION=("${BUILT_MODULE_LOCATION[@]}")
    DEST_MODULE_LOCATION=("${DEST_MODULE_LOCATION[@]}")
fi

AUTOINSTALL="yes"
